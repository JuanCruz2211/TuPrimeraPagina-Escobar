<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Mi Proyecto Coder{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{% url 'Inicio' %}">AppCoder</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'Inicio' %}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'CursoFormulario' %}">Agregar Curso</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'EstudianteFormulario' %}">Agregar Estudiante</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'ProfesorFormulario' %}">Agregar Profesor</a></li>
                    <li class="nav-item"><a class="nav-link text-warning" href="{% url 'BusquedaCurso' %}">Buscar</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-5 mb-5">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto fixed-bottom">
        <p class="mb-0">&copy; 2026 Juan Cruz Escobar - Proyecto Coderhouse</p>
    </footer>

</body>
</html>
