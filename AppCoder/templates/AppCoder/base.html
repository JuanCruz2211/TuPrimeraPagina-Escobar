<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Proyecto Coderhouse{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0d6efd;
            --accent-color: #f0ad4e;
        }

        .navbar {
            background: linear-gradient(90deg, #1a1e21 0%, #343a40 100%) !important;
        }

        .nav-link {
            transition: 0.3s ease-in-out;
        }
        .nav-link:hover {
            color: var(--accent-color) !important;
            transform: scale(1.05);
        }

        .card-custom {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s;
        }
        .card-custom:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body class="bg-light">
    
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'Inicio' %}">AppCoder</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'Inicio' %}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'CursoFormulario' %}">Agregar Curso</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'EstudianteFormulario' %}">Agregar Estudiante</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'ProfesorFormulario' %}">Agregar Profesor</a></li>
                    <li class="nav-item"><a class="nav-link text-warning fw-bold" href="{% url 'BusquedaCurso' %}">Buscar</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-5 mb-5">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto fixed-bottom">
        <p class="mb-0">&copy; 2026 Juan Cruz Escobar - Proyecto Coderhouse</p>
    </footer>

</body>
</html>
