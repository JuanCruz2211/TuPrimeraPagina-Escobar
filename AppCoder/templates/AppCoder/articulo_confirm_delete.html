{% extends 'AppCoder/base.html' %}
{% block title %}Borrar Artículo{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center mt-5">
        <h2 class="text-danger">¿Estás seguro?</h2>
        <p class="lead mt-3">Estás a punto de borrar definitivamente el artículo:</p>
        <h4>"{{ object.titulo }}"</h4>
        <p class="text-muted">Esta acción no se puede deshacer.</p>
        
        <form method="POST" class="mt-4">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-lg">Sí, borrar</button>
            <a href="{% url 'ArticuloDetalle' object.id %}" class="btn btn-secondary btn-lg">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
