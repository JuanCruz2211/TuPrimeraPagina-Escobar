{% extends 'AppCoder/base.html' %}

{% block title %}Agregar Profesor{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-custom overflow-hidden">
                <div class="card-header bg-primary text-white text-center py-3 border-0">
                    <h4 class="mb-0">Registrar Nuevo Profesor</h4>
                </div>
                <div class="card-body p-4">
                    <form action="" method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            {{ miFormulario.as_p }}
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100 btn-lg shadow-sm">Guardar Registro</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
